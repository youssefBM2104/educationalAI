<div class="dashboard" [class.dashboard--sidebar-closed]="!sidebarOpen()">

  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar__left">
      <button
        class="topbar__menu-btn"
        type="button"
        (click)="toggleSidebar()"
        [attr.aria-label]="sidebarOpen() ? 'Close sidebar' : 'Open sidebar'"
        [attr.aria-expanded]="sidebarOpen()"
      >
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <rect y="2"  width="18" height="2" rx="1" fill="currentColor"/>
          <rect y="8"  width="18" height="2" rx="1" fill="currentColor"/>
          <rect y="14" width="18" height="2" rx="1" fill="currentColor"/>
        </svg>
      </button>
      <span class="topbar__brand">Praxis</span>
    </div>
    <div class="topbar__right">
      <span class="topbar__role-pill">Lecturer</span>
      <div class="topbar__avatar" aria-hidden="true">NH</div>
    </div>
  </header>

  <!-- Sidebar -->
  <nav class="sidebar" aria-label="Workspace navigation">
    <p class="sidebar__eyebrow">Workspace</p>

    <a class="nav-item" routerLinkActive="nav-item--active" routerLink="materials">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <rect x="2" y="1" width="9" height="12" rx="1" stroke="currentColor" stroke-width="1.5"/>
        <path d="M5 5h5M5 8h3" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
        <path d="M11 5l3 3-3 3" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Materials
    </a>

    <span class="nav-item nav-item--disabled" role="button" aria-disabled="true" title="Question bank — coming soon">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M8 2a3 3 0 0 1 1 5.83V9H7V7.83A3 3 0 0 1 8 2Z" stroke="currentColor" stroke-width="1.5" fill="none"/>
        <circle cx="8" cy="12.5" r="1" fill="currentColor"/>
      </svg>
      Question bank
      <span class="nav-item__soon">Soon</span>
    </span>

    <span class="nav-item nav-item--disabled" role="button" aria-disabled="true" title="Exam generation — coming soon">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
        <path d="M5 8h6M5 5h6M5 11h4" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
      </svg>
      Exam generation
      <span class="nav-item__soon">Soon</span>
    </span>

    <span class="nav-item nav-item--disabled" role="button" aria-disabled="true" title="Slide generation — coming soon">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <rect x="1" y="3" width="14" height="10" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
        <path d="M6 7l3 2-3 2V7Z" fill="currentColor"/>
      </svg>
      Slide generation
      <span class="nav-item__soon">Soon</span>
    </span>

    <div class="sidebar__divider" role="separator"></div>
    <p class="sidebar__eyebrow">Account</p>

    <span class="nav-item nav-item--disabled" role="button" aria-disabled="true">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.5"/>
        <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.42 1.42M11.53 11.53l1.42 1.42M3.05 12.95l1.42-1.42M11.53 4.47l1.42-1.42" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
      </svg>
      Settings
    </span>
  </nav>

  <!-- Main content area -->
  <main class="content" id="main-content" tabindex="-1">
    <router-outlet />
  </main>

</div>
