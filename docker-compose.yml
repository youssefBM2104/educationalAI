# docker-compose.yml

services:

  # ─── Relational DB ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: edu_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 5

  # ─── Redis (Celery broker) ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: edu_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  # ─── MinIO (object storage for raw files + markdown) ──────────────────────
  minio:
    image: minio/minio:latest
    container_name: edu_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console (browser UI)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 5

  # ─── Qdrant (vector DB) ───────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: edu_qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  # ─── Neo4j (knowledge graph) ──────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: edu_neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol
    volumes:
      - neo4j_data:/data

  # Ce
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edu_celery_worker
    command: celery -A backend.tasks.ingestion_tasks worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
  
volumes:
  postgres_data:
  minio_data:
  qdrant_data:
  neo4j_data: